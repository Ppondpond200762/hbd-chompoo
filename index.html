<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday My Love 💖 | E-Card ย้อนความทรงจำ</title>
  <meta name="description" content="E-Card วันเกิดสำหรับภรรยา เกมย้อนความทรงจำของเรา พร้อมของขวัญชิ้นพิเศษ" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { mali: ['Mali', 'sans-serif'], script: ['Pacifico', 'cursive'] },
        colors: { blush: '#ffb48a', rose: '#f97c3c', cream: '#fffaf4', lilac: '#ffe4d2', peach: '#ffcfb1', ink: '#7a3517' },
      } }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="font-mali min-h-[100dvh] text-ink overflow-x-hidden">
  <!-- ดอกเดซี่ SVG ต้นแบบ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="daisyCenter" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#fff3a0" /><stop offset="60%" stop-color="#ffd23f" /><stop offset="100%" stop-color="#f5a623" />
      </radialGradient>
      <symbol id="daisy" viewBox="-50 -50 100 100">
        <g fill="#ffffff" stroke="#ffd9c2" stroke-width="1.2">
          <ellipse rx="9" ry="24" cy="-22" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(30)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(60)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(90)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(120)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(150)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(180)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(210)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(240)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(270)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(300)" />
          <ellipse rx="9" ry="24" cy="-22" transform="rotate(330)" />
        </g>
        <circle r="13" fill="url(#daisyCenter)" />
        <g fill="#e8901a" opacity=".55"><circle cx="-4" cy="-3" r="1.4"/><circle cx="4" cy="2" r="1.4"/><circle cx="-1" cy="5" r="1.4"/><circle cx="5" cy="-5" r="1.2"/></g>
      </symbol>
    </defs>
  </svg>

  <!-- ดอกเดซี่ตกแต่งตามมุมจอ (เลเยอร์พื้นหลัง กดทะลุได้) -->
  <div id="daisies" aria-hidden="true">
    <div class="daisy bounce" style="top:-30px;left:-30px;width:130px;height:130px;--r:-10deg"><svg><use href="#daisy"/></svg></div>
    <div class="daisy pulse spin" style="top:70px;left:60px;width:56px;height:56px;animation-delay:-1s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy pulse" style="top:-20px;right:-25px;width:110px;height:110px;--r:15deg;animation-delay:-2s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy bounce hide-sm" style="top:120px;right:80px;width:48px;height:48px;animation-delay:-.8s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy bounce spin" style="bottom:-35px;left:-25px;width:120px;height:120px;--r:20deg;animation-delay:-1.5s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy pulse hide-sm" style="bottom:90px;left:70px;width:50px;height:50px;animation-delay:-2.6s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy pulse" style="bottom:-30px;right:-30px;width:140px;height:140px;--r:-20deg;animation-delay:-.4s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy bounce" style="bottom:100px;right:50px;width:60px;height:60px;animation-delay:-3s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy pulse hide-sm" style="top:45%;left:2%;width:42px;height:42px;animation-delay:-1.2s"><svg><use href="#daisy"/></svg></div>
    <div class="daisy bounce hide-sm" style="top:50%;right:2%;width:44px;height:44px;animation-delay:-2.2s"><svg><use href="#daisy"/></svg></div>
  </div>

  <!-- พื้นหลังลอยๆ -->
  <div id="floaters" class="fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>

  <main class="relative z-10 min-h-[100dvh] flex items-center justify-center p-4 sm:p-8">

    <!-- 1. COVER -->
    <section id="page-cover" class="page active w-full max-w-xl">
      <div class="glass rounded-[2rem] p-8 sm:p-12 text-center relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-blush/40 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-lilac/50 rounded-full blur-2xl"></div>
        <div class="text-6xl sm:text-7xl mb-4 animate-bounce-slow">🎂</div>
        <p class="text-rose/80 tracking-widest text-sm sm:text-base">TO MY DEAREST</p>
        <h1 class="font-script text-5xl sm:text-6xl text-gradient my-4 leading-tight">Happy Birthday</h1>
        <p class="text-xl sm:text-2xl font-semibold">สุขสันต์วันเกิดนะ <span id="wife-name"></span> 💕</p>
        <p class="mt-3 text-ink/70 text-base sm:text-lg">มาเล่นเกมเล็กๆ ย้อนดูความทรงจำ 10 ภาพของเรากันนะ</p>
        <button id="btn-start" class="btn-main mt-8 w-full text-lg sm:text-xl">✨ เริ่มต้นย้อนความทรงจำของเรา ✨</button>
      </div>
    </section>

    <!-- 2. QUIZ -->
    <section id="page-quiz" class="page w-full max-w-2xl">
      <div class="glass rounded-[2rem] p-4 sm:p-6 md:p-8">
        <div class="flex items-center justify-between mb-3 text-sm sm:text-base font-semibold">
          <span>💝 ความทรงจำที่ <span id="q-num">1</span> / <span id="q-total">10</span></span>
          <span id="q-hearts" class="tracking-tight"></span>
        </div>
        <div class="h-3 progress-track rounded-full overflow-hidden mb-4">
          <div id="q-progress" class="h-full progress-bar transition-all duration-500" style="width:0%"></div>
        </div>
        <div id="q-card" class="quiz-card">
          <div class="photo-frame">
            <img id="q-img" src="" alt="รูปความทรงจำของครอบครัว" class="w-full h-full object-contain" />
          </div>
          <h2 id="q-text" class="q-text-box text-center text-base sm:text-xl font-semibold my-4 sm:my-5"></h2>
          <div id="q-choices" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>
      </div>
    </section>

    <!-- 3. MESSAGE -->
    <section id="page-message" class="page w-full max-w-xl">
      <div class="glass rounded-[2rem] p-8 sm:p-12 text-center">
        <div class="text-6xl mb-2 animate-heartbeat">💖</div>
        <h2 class="font-script text-4xl sm:text-5xl text-gradient mb-6">For You, My Love</h2>
        <div id="msg-body" class="space-y-4 text-base sm:text-lg leading-relaxed text-ink/90"></div>
        <p class="mt-6 font-semibold">— รักเสมอ, <span id="from-name"></span></p>
        <button id="btn-gift" class="btn-main mt-8 w-full text-lg sm:text-xl">🎁 เปิดของขวัญชิ้นสุดท้าย</button>
      </div>
    </section>

    <!-- 4. VIDEO -->
    <section id="page-video" class="page w-full max-w-6xl">
      <div class="text-center mb-4">
        <h2 class="font-script text-4xl sm:text-5xl text-gradient">A Song For You 🎶</h2>
      </div>
      <div id="yt-player" class="glass rounded-[1.5rem] p-2 sm:p-3"></div>
      <div class="text-center mt-6">
        <button id="btn-replay" class="btn-soft">🔁 ย้อนความทรงจำอีกครั้ง</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
